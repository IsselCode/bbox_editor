plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bbox.editor'
    compileSdk 35
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    // Flutter publishes the embedding with an engine-hash version. The
    // Flutter Gradle plugin supplies the matching embedding to each variant;
    // declaring a fixed 1.0.0 coordinate makes current Flutter versions fail.
}
