plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bbox.editor'
    compileSdk 35
    defaultConfig { minSdk 21 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    // The plugin is compiled against Flutter's release embedding so it can
    // also be consumed by applications when assembling a release APK.
    compileOnly 'io.flutter:flutter_embedding_release:1.0.0'
}
